<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#232427"><meta name="description" content="Entrenamiento híbrido para vivir mejor">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Impulso">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}</style>
<title>Impulso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de celular — encabezado de marca, una vista por pestaña (Perfil, Entrena, Nutrición), barra fija abajo y hojas a pantalla completa para cargar datos */
:root{
  /* tema único: gris oscuro de Impulso */
  --bg:#232427; --surface:#2D2F33; --soft:#383A3F; --line:#43464C; --deep:#17181B;
  --ink:#F0F1F2; --muted:#A3A7AD;
  --accent:#F0643C; --accent-ink:#1A0E09;
  --blue:#5BA8E8; --yellow:#F2C14E; --green:#4CC38A; --red:#F0536C;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navh:66px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--navh) + 110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.num,.big{font-family:var(--display);font-variant-numeric:tabular-nums}
h2{font-size:24px;font-weight:700;margin:0;letter-spacing:.3px;text-transform:uppercase;text-wrap:balance}
h3{font-size:18px;font-weight:600;margin:0;letter-spacing:.4px;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--blue)}

/* encabezado */
header.top{display:flex;align-items:center;gap:10px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:32px;height:32px;flex:none}
.brand h1{font-size:26px;font-weight:700;margin:0;letter-spacing:.6px;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.toplink{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 13px;white-space:nowrap}

/* piezas comunes */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.accent{background:var(--accent);color:var(--accent-ink)}
.pill.dark{background:var(--deep);color:var(--ink);border:1px solid var(--line)}
.pill.ghost{background:var(--soft);color:var(--ink)}
.pill.sm{padding:7px 12px;font-size:14px}
.pill:disabled{opacity:.45;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg,.pill svg,.nav svg,.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:10px 6px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:44px;height:44px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty b{font-size:17px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li small{display:block;color:var(--muted);font-size:13px}
.del{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;padding:6px}
.del[data-armed]{color:var(--red)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
.unitbox{position:relative}
.unitbox input{padding-right:46px}
.unitbox span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* perfil */
.prof{display:flex;align-items:center;gap:16px;padding-block:6px 4px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--deep);border:3px solid var(--accent);display:grid;place-items:center;flex:none;position:relative}
.avatar svg{width:46px;height:46px}
.avatar .lv{position:absolute;top:-6px;right:-10px;background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:999px;font-family:var(--display);font-weight:700;font-size:14px;padding:1px 8px}
.prof .who{flex:1;min-width:0}
.prof .name{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;background:none;border:0;padding:0;cursor:pointer;text-align:left;width:auto;overflow-wrap:anywhere}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.counts b{display:block;font-family:var(--display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.counts span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-style:italic;font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.lvbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:16px}
.lvbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lvrow{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--muted)}
.lvrow b{color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px}
.mini b{display:block;font-family:var(--display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--muted)}

/* entrena */
.month{display:flex;align-items:center;gap:8px}
.month strong{flex:1;text-align:center;font-family:var(--display);font-size:22px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;position:relative}
.week small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.week b{font-family:var(--display);font-size:22px;line-height:1}
.week button.today b{color:var(--accent)}
.week button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week button[aria-pressed="true"] small,.week button[aria-pressed="true"] b{color:var(--accent-ink)}
.week i{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:2px}
.week button[aria-pressed="true"] i{background:var(--accent-ink)}
.week i.no{background:transparent}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtns .pill{justify-content:center;padding:16px 10px;font-size:17px;border-radius:999px}
.bigbtns .pill .ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.14)}
.link{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px 12px 12px;cursor:pointer;text-align:left;width:100%}
.link .ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);flex:none}
.link .ring.fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.link .grow{flex:1;min-width:0}
.link b{display:block;font-size:16px}
.link small{color:var(--muted);font-size:14px}
.badge{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:50%;background:var(--deep);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:18px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.prog .ban{height:130px;position:relative;background:linear-gradient(135deg,#3A2219 0%,#1B1C1F 70%);overflow:hidden}
.prog .ban svg.mk{position:absolute;right:-18px;top:-26px;width:190px;height:190px;opacity:.9}
.prog .ban .tl{position:absolute;left:14px;top:14px}
.prog .ban .bl{position:absolute;left:14px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
.prog .ban .bl .chip{background:rgba(23,24,27,.75)}
.prog .body{padding:16px 18px 18px}
.prog .body h3{font-size:26px;text-transform:none;letter-spacing:0}
.prog .nx{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.prog .nx b{display:block;font-size:17px}
.go{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ses{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer;text-align:left;width:100%}
.ses .tag{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:15px}
.tag.F{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.tag.R{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--blue)}
.tag.H{background:color-mix(in srgb,var(--yellow) 22%,transparent);color:var(--yellow)}
.ses .grow{flex:1;min-width:0}
.ses b{display:block}
.ses small{color:var(--muted);font-size:13px}

/* detalle de programa */
.pban{border-radius:26px;overflow:hidden;position:relative;background:linear-gradient(135deg,#3A2219 0%,#1B1C1F 72%);padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.pban svg.mk{position:absolute;right:-20px;top:-30px;width:200px;height:200px;opacity:.85}
.pban h2{font-size:32px;text-transform:none;letter-spacing:0;position:relative}
.pban p{position:relative;color:#D9DBDE}
.pban .chip{align-self:flex-start;position:relative;background:rgba(23,24,27,.75)}
.wknav{display:flex;align-items:center;gap:10px}
.wknav strong{flex:1;text-align:center;font-family:var(--display);font-size:20px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.dcard.next{border-color:var(--accent)}
.dtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dtop .chip.ty{background:var(--deep);border-color:var(--deep)}
.dtop .chip.ty.c{color:var(--blue)} .dtop .chip.ty.h{color:var(--yellow)}
.dtop .ok{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dmid{display:flex;align-items:center;gap:12px}
.dtxt{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.dtxt b{display:block;font-size:21px;font-weight:600;line-height:1.2}
.dtxt small{display:block;color:var(--muted);font-size:15px;margin-top:3px}
.go.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.go.done{background:var(--soft);color:var(--accent)}

/* Hoy */
.hoy{display:flex;flex-direction:column;gap:12px}
.hoy-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hoy-h h2{font-size:30px;text-transform:none;letter-spacing:0}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}
.goal b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.goal b small{font-size:16px;color:var(--muted);margin-left:2px}
.goal span{font-size:12px;color:var(--muted);font-weight:600}
.goal.ok{border-color:var(--green)} .goal.ok b{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px}
.opt.main{border-color:var(--accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface)) 0%,var(--surface) 55%)}
.opt h3{font-size:26px;text-transform:none;letter-spacing:0}
.opt-t{display:flex;gap:6px;flex-wrap:wrap}
.opt-list{font-size:14px;color:var(--ink);opacity:.85}
.hoy-a{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hoy-a .pill{justify-content:center}
.done-w{background:color-mix(in srgb,var(--green) 14%,var(--surface));border:1px solid var(--green);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.loadc{padding:16px}
.lbars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:130px;margin:12px 0 8px}
.lb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.lb i{width:100%;max-width:46px;border-radius:8px;background:var(--soft)}
.lb.cur i{background:var(--accent)}
.lb span{font-size:12px;color:var(--muted)}
.lb b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.tag.D{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer}
.rpe button.r1,.rpe button.r2,.rpe button.r3{color:var(--green)} .rpe button.r4,.rpe button.r5,.rpe button.r6{color:var(--yellow)} .rpe button.r7,.rpe button.r8{color:var(--accent)} .rpe button.r9,.rpe button.r10{color:var(--red)}
.rpe button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{cursor:pointer;padding:9px 14px;font-size:14px}
.ocards{display:grid;gap:8px}
.ocard{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ocard b{font-size:16px} .ocard small{color:var(--muted);font-size:13px}
.ocard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.intro h2{font-size:30px;text-transform:none;letter-spacing:0}
.intro .hint{margin-top:6px;font-size:15px}

/* modo Entrenar */
.live{position:sticky;top:-16px;z-index:5;margin:-16px -16px 0;padding:14px 16px 12px;background:var(--deep);border-bottom:1px solid var(--line);border-radius:0 0 24px 24px;display:flex;flex-direction:column;gap:10px}
.live-r{display:flex;align-items:center;gap:12px}
.live-r b{flex:1;font-family:var(--display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.restbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:8px 10px}
.restbar .grow{flex:1;min-width:0}
.restbar span{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.restbar b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.restline{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.restline i{display:block;height:100%;background:var(--accent)}
.exb{display:flex;flex-direction:column;gap:10px;padding-block:8px 16px;border-bottom:1px solid var(--line)}
.exh{display:flex;align-items:center;gap:12px}
.exname{flex:1;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.thumb{width:92px;height:92px;border-radius:16px;border:1px solid var(--line);background:var(--surface);flex:none;overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);padding:0}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb small{font-size:11px}
.thumb svg:not(.anim){width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thumb svg.anim{width:100%;height:100%;padding:6px}
.thumb .add{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;background:var(--deep);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-size:15px;line-height:1}
.medanim{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px}
.medanim svg{display:block;width:100%;max-height:44vh}
.vidlink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px}
.vidlink .yt{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font-size:14px}
.vidlink .grow{flex:1;min-width:0}
.vidlink b{display:block;font-size:15px}
.vidlink small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.medcard .empty svg,.exb .empty svg{fill:none}
.thumb .pl{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px}
.exdesc{border:0;background:none;padding:0;text-align:left;color:var(--muted);font-style:italic;font-size:15px;cursor:pointer}
.restbtn{align-self:flex-start;border:0;background:none;color:var(--accent);font-family:var(--display);font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0}
.restbtn .ico{width:22px;height:22px}
.sgrid{display:grid;grid-template-columns:40px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 40px;gap:6px;align-items:center}
.shd span{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.shd .hl{color:var(--accent)}
.srow{padding:6px 0;border-radius:12px}
.srow:nth-child(odd){background:color-mix(in srgb,var(--surface) 60%,transparent)}
.srow input{padding:9px 2px;text-align:center;background:var(--bg);font-size:15px}
.srow.ok input{border-color:color-mix(in srgb,var(--green) 60%,var(--line))}
.sb{width:36px;height:36px;border-radius:50%;border:0;background:var(--deep);color:var(--ink);font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.sb.W{background:var(--yellow);color:var(--accent-ink)} .sb.F{background:var(--red);color:#fff}
.pv{font-size:13px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.ck{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:none;color:transparent;font-size:18px;font-weight:700;cursor:pointer}
.ck.on{background:var(--green);border-color:var(--green);color:#10291C}
.addset{border:0;background:none;font-weight:700;font-size:16px;cursor:pointer;padding:6px 0}
.runclk{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.runclk .grow{flex:1}
.runclk span{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.runclk b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.medov{position:fixed;inset:0;z-index:70;background:rgba(10,10,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.medcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.medcard img,.medcard video{width:100%;max-height:50vh;object-fit:contain;border-radius:16px;background:#000;display:block}
.resume{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--accent);border-radius:20px;padding:12px}
.resume .ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.resume .ring.fill{background:var(--accent);color:var(--accent-ink)}
.resume .ring svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.resume .grow{flex:1;min-width:0}
.resume small{display:block;color:var(--muted);font-size:13px}
.resume.pend{border-color:var(--blue)}
.pendbox{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px dashed var(--blue);border-radius:16px;padding:12px}

/* desafío del día */
.fab{position:fixed;right:16px;bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px));z-index:35;width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 30% 25%,#FFE08A 0%,var(--yellow) 45%,#E09A1E 100%);color:#2A1A05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 8px 22px rgba(242,193,78,.35),0 0 0 4px var(--bg);font-weight:800;font-size:11px;letter-spacing:.3px}
.fab svg{width:28px;height:28px;fill:currentColor}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--yellow);opacity:.0;animation:fabp 2.4s ease-out infinite}
.fab.done{background:var(--surface);color:var(--yellow);box-shadow:0 0 0 2px var(--yellow),0 0 0 6px var(--bg)}
.fab.done::after{animation:none}
@keyframes fabp{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion: reduce){ .fab::after{animation:none} }
.chhero{border-left-width:5px;border-radius:24px;padding:20px 18px;background:linear-gradient(150deg,color-mix(in srgb,var(--yellow) 26%,var(--surface)) 0%,var(--surface) 70%);border:1px solid var(--yellow);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.chhero h2{font-size:34px;text-transform:none;letter-spacing:0;position:relative}
.chhero p,.chhero .chgoal{position:relative}
.chhero .chbolt{opacity:.35;width:120px;height:120px;right:-8px;top:-6px}
.chhero .chbolt svg{fill:none}
.chgoal{margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.chgoal b{font-family:var(--display);font-size:22px;color:var(--yellow)}
.chgoal span{font-size:14px;color:var(--muted)}
.lvup{display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--green) 14%,var(--bg));border:1px solid var(--green);border-radius:16px;padding:12px}
.lvup b{color:var(--green)}
.trk .grow{flex:1;min-width:0}
.planmode nav.nav,.planmode #fab,.planmode #fbBtn{display:none!important}
.planmode .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.lesion,.pnote{display:flex;flex-direction:column;gap:4px;border-radius:18px;padding:12px 14px}
.lesion{background:color-mix(in srgb,var(--red) 14%,var(--bg));border:1px solid var(--red)} .lesion b{color:var(--red)}
.pnote{background:var(--card);border:1px solid var(--line)} .pnote b{color:var(--accent)}
.pnota{margin:0;font-size:14px;color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,var(--bg));border-radius:12px;padding:8px 10px}
.pnota b{color:var(--accent)}
.cqbtn{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.cq{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.cq:first-of-type{border-top:0}
.cq p{margin:0;line-height:1.4} .cq .q small{color:var(--muted);display:block} .cq .a{color:var(--ink);background:var(--bg);border-radius:12px;padding:8px 10px}
.cq .a b{color:var(--accent)}
.cqb{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cqbox{border-color:var(--accent)}
.cqq{margin:0;background:var(--bg);border-radius:12px;padding:10px 12px;line-height:1.4}
.tgl{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--red);margin-top:2px}
.tgl span{display:flex;flex-direction:column} .tgl small{color:var(--muted)}
.pses input[data-sn]{min-width:0}
.pses select{flex:none;width:92px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 8px;height:44px;font:inherit}
.pit{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.pnums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end}
.pnums label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.pnums input,.pnums select{width:100%;min-width:0}
.pnums .chip{height:44px;padding:0 6px;font-size:12px}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.auth-in{width:100%;max-width:420px;padding:48px 20px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.auth-brand img{border-radius:18px}
.auth-brand h1{font-family:var(--display);font-size:40px;margin:6px 0 0;text-transform:uppercase;letter-spacing:.02em}
.auth-brand p{margin:0;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:8px;align-self:center}
.medcard.ro label,.medcard.ro #mdMsg,.medcard.ro #mdDel,.medcard.ro .medanim+.hint{display:none}
.feed{display:flex;flex-direction:column}
.feed .fi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.feed .fi:first-child{border-top:0}
.feed .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.feed .dot.s{background:var(--blue)} .feed .dot.d{background:var(--yellow)}
.feed p{margin:0;line-height:1.35}
.feed small{color:var(--muted);font-size:13px}
.pl{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.pl .ph{display:flex;align-items:center;gap:10px}
.pl .av{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--accent) 22%,var(--bg));color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:17px}
.pl .nm small{color:var(--muted);font-size:13px;display:block}
.warn{color:var(--red)} .ok{color:var(--green)}
.wkbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.wkbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.steps li{line-height:1.4}
details.how summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.how summary::-webkit-details-marker{display:none}
.sesl{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.sesl:first-of-type{border-top:0}
.sesl small{color:var(--muted)}
.gripsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gripsel button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.gripsel button small{font-size:11px;color:var(--muted);text-align:center}
.gripsel button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.gripsel button.on b{color:var(--accent)}
.trk small{display:block}
.trk .tl{color:var(--ink);opacity:.8;margin-top:2px}
.trk.on{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.c-accent{border-left:5px solid var(--accent)} .c-blue{border-left:5px solid var(--blue)} .c-green{border-left:5px solid var(--green)} .c-yellow{border-left:5px solid var(--yellow)} .c-red{border-left:5px solid var(--red)}
.chbolt{position:absolute;right:-14px;top:-10px;width:110px;height:110px;opacity:.18}
.chbolt svg{width:100%;height:100%;fill:var(--yellow)}
.chclock{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.chclock b{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
/* reps / tiempo */
.modesw{display:inline-grid;grid-auto-flow:column;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.modesw button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.modesw button[aria-pressed="true"]{background:var(--deep);color:var(--accent)}
.tmr{height:38px;border-radius:12px;border:1px solid var(--accent);background:none;color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.tmr svg{width:18px;height:18px}
.tmr.run{background:var(--accent);color:var(--accent-ink)}
.tmr b{font-family:var(--display);font-size:20px}
/* elegir ejercicios */
.picker .medcard{max-height:88vh}
.grp{display:grid;gap:10px}
.grpb{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:12px 14px;cursor:pointer}
.grpb b{display:block;font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.grpb small{color:var(--muted);font-size:13px}
.grpb .gi{width:64px;height:64px;border-radius:16px;background:var(--surface);flex:none;display:block}
.grpb .gi svg{width:100%;height:100%;padding:4px}
.g-inferior{border-left:5px solid var(--accent)} .g-media{border-left:5px solid var(--yellow)} .g-superior{border-left:5px solid var(--blue)}
.pklist{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto}
.pki{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 10px;cursor:pointer}
.pki.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.pki .grow{flex:1;min-width:0} .pki b{display:block;font-size:15px} .pki small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkt{width:48px;height:48px;border-radius:12px;background:var(--surface);flex:none;display:block}
.pkt svg{width:100%;height:100%;padding:3px}
.pkt svg.noimg{padding:12px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.pkc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;flex:none}
.pki.on .pkc{background:var(--accent);color:var(--accent-ink)}

/* anotar mejoras */
.fbbtn{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);background:var(--soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.fbbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fbbtn + .toplink{margin-left:0}
.fbn{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fbtags{display:flex;gap:6px;flex-wrap:wrap}
.fbtags .chip{cursor:pointer}
.fblist{display:flex;flex-direction:column;max-height:34vh;overflow-y:auto}
.fbit{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.fbit:last-child{border-bottom:0}
.fbit .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.fbit small{display:block;color:var(--muted);font-size:12px}
.fbit.done .grow{opacity:.5;text-decoration:line-through}

/* nutrición */
.calrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ringwrap{position:relative;width:150px;height:150px}
.ringwrap svg{width:150px;height:150px;transform:rotate(-90deg)}
.ringwrap .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .c svg{width:26px;height:26px;transform:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ringwrap .c b{font-family:var(--display);font-size:30px;line-height:1}
.calnum{text-align:center}
.calnum .big{font-size:54px;font-weight:700;line-height:1}
.calnum .two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.calnum .two b{display:block;font-family:var(--display);font-size:24px}
.calnum .two span{font-size:12px;color:var(--muted)}
.daynav{display:flex;align-items:center;gap:10px}
.daynav strong{flex:1;text-align:center;font-family:var(--display);font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:4px}
.eq b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.eq span{font-size:12px;color:var(--muted)}
.eq i{font-style:normal;color:var(--muted);font-size:22px}
.meal{padding-block:4px 10px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal-h{display:flex;align-items:center;gap:10px;padding-block:10px}
.meal-h .grow{flex:1}
.meal-h b{font-size:19px}
.meal-h small{display:block;color:var(--muted);font-size:13px}
.meal-h .k{font-family:var(--display);font-size:20px;font-weight:600}
.food{display:flex;align-items:center;gap:10px;padding:8px 0}
.food .grow{flex:1;min-width:0}
.food small{display:block;color:var(--muted);font-size:13px}
.food .k{font-family:var(--display);font-size:18px}
.nofood{color:var(--muted);font-style:italic;text-align:center;font-size:14px;padding:6px 0 4px}
.addfood{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;text-align:center}
.stats4 b{display:block;font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05}
.stats4 span{font-size:13px;color:var(--muted)}
.dbar{display:grid;grid-template-columns:96px minmax(0,1fr) 80px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.dbar:last-child{border-bottom:0}
.dbar .tr{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.dbar .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dbar .n{text-align:right;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--line)} .chart .lbl{fill:var(--muted);font:19px var(--body)}
.chart .goal{stroke:var(--yellow);stroke-dasharray:5 5;stroke-width:1.5}
.chart .bar{fill:var(--accent)} .chart .bar.over{fill:var(--red)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3}
.chart .pt{fill:var(--accent)}

/* hojas */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h h2{flex:1;font-size:22px;text-align:center;margin-right:44px}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-b .in{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:16px 28px;display:flex;flex-direction:column;gap:14px}
.sheet-f{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-f .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-f .pill{justify-content:center;padding:14px;border-radius:14px;font-size:16px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;gap:8px;align-items:center}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.set .no{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set input{padding:9px 10px}
.set .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumrow div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sumrow b{display:block;font-family:var(--display);font-size:24px;line-height:1.05}
.sumrow span{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n=parseFloat(String(v??"").replace(",", ".")); return isFinite(n)?n:null; };
const fmt = (n,d=0) => (n==null||!isFinite(n)) ? "–" : n.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = n => n>=1000 ? fmt(n/1000,1)+"k" : fmt(n,0);
const iso = d => d.toLocaleDateString("sv");
const today = () => iso(new Date());
const pd = s => new Date(s+"T12:00");
const addDays = (s,n) => { const d=pd(s); d.setDate(d.getDate()+n); return iso(d); };
const fDay = s => pd(s).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});
const fDayShort = s => pd(s).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
const wName = s => { const t=today(); if(s===t) return "Hoy"; if(s===addDays(t,-1)) return "Ayer"; const n=pd(s).toLocaleDateString("es-AR",{weekday:"long",day:"numeric"}); return n.charAt(0).toUpperCase()+n.slice(1); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function twoTap(btn, ask, fn){
  return ()=>{
    if(btn.dataset.armed){ clearTimeout(btn._tt); btn.textContent=btn.dataset.orig; delete btn.dataset.armed; fn(); return; }
    btn.dataset.orig=btn.textContent; btn.dataset.armed="1"; btn.textContent=ask;
    btn._tt=setTimeout(()=>{ if(btn.dataset.armed){ btn.textContent=btn.dataset.orig; delete btn.dataset.armed; } },3500);
  };
}
const I = {
  arrowL:'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  arrowR:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  pencil:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  dumb:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  run:'<svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M14 8h6v6"/></svg>',
  scale:'<svg viewBox="0 0 24 24"><path d="M12 3v18M5 21h14M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>',
  ruler:'<svg viewBox="0 0 24 24"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  flame:'<svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  mark:'<svg class="mk" viewBox="0 0 34 34" aria-hidden="true"><path d="M5 27l12-12 12 12" fill="none" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17l12-12 12 12" fill="none" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/></svg>'
};
const MARK_SVG = '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M8 25l9-9 9 9" fill="none" stroke="var(--accent)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16l9-9 9 9" fill="none" stroke="var(--accent)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></svg>';

/* ---------- Guardado: nube (db) o este dispositivo ---------- */
const LS = "impulso-hibrid-v1";
const COLS = ["perfil","sesiones","programas","composicion","perimetros","fotos","comidas","ejercicios","mejoras","desafios"];
const state = {}; COLS.forEach(c=>state[c]=[]);
let db = null, assets = null;
/* Roles: el dueño (entrenador) usa las colecciones de siempre; cada jugadora guarda en u/<su id>/ */
const ROLE = {coach:true, uid:null, base:"", user:null, name:""};
const cpath = c => c==="ejercicios" ? c : ROLE.base + c;
function pushMe(){ if(!db || ROLE.coach || !ROLE.uid) return; const p=profile();
  db.doc(`u/${ROLE.uid}`).set({nombre:p.nombre||ROLE.name||"", dep:p.dep||"ninguno", niv:p.niv||null, obj:p.obj||null, dias:p.dias||3, act:Date.now()}).catch(()=>{}); }
function lsRead(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"{}"); COLS.forEach(c=>{ if(Array.isArray(d[c])) state[c]=d[c]; }); }catch(e){} }
function lsWrite(){ if(db) return; try{ const o={}; COLS.forEach(c=>o[c]=state[c]); localStorage.setItem(LS, JSON.stringify(o)); }catch(e){ toast("No queda espacio en este dispositivo. Borrá fotos viejas."); } }
function saveErr(e){ toast(e && e.code==="quota_exceeded" ? "Se llenó el espacio de guardado. Borrá fotos viejas." : "No se pudo guardar. Probá de nuevo."); }
async function addDoc(col, data){
  if(db){ await db.collection(cpath(col)).add(data); if(col!=="mejoras") pushMe(); return; }
  state[col].push({id:uid(), ...data}); lsWrite(); renderAll();
}
async function setDoc(col, id, data){
  if(db){ await db.collection(cpath(col)).doc(id).set(data); if(col!=="mejoras") pushMe(); return; }
  const i=state[col].findIndex(x=>x.id===id); if(i>=0) state[col][i]={id,...data}; else state[col].push({id,...data}); lsWrite(); renderAll();
}
async function delDoc(col, id){
  if(db){ await db.collection(cpath(col)).doc(id).delete(); return; }
  state[col]=state[col].filter(x=>x.id!==id); lsWrite(); renderAll();
}
/* ---------- Conexión con Supabase (cuentas, datos y archivos) ---------- */
const CFG = window.IMPULSO_CONFIG || {};
const SB = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}) : null;
let ME = null;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
/* Misma forma que usaba la app antes (colecciones con onSnapshot), pero guardando en Supabase */
function makeDb(){
  const subs = [];  // {key, fetch, fn, err}
  const parse = path => { const s=path.split("/");
    if(path==="ejercicios") return {kind:"ej", key:"ej"};
    if(path==="u") return {kind:"team", key:"team"};
    if(s.length===3 && s[0]==="u") return {kind:"docs", uid:s[1], col:s[2], key:`${s[1]}|${s[2]}`};
    return {kind:"docs", uid:ME, col:path, key:`${ME}|${path}`}; };
  const snap = rows => ({docs: rows.map(r=>({id:r.id, data:()=>r.data||{}}))});
  async function load(p){
    if(p.kind==="ej"){ const {data,error}=await SB.from("ejercicios").select("id,data"); if(error) throw error; return data; }
    if(p.kind==="team"){ const {data,error}=await SB.from("docs").select("user_id,data,updated_at").eq("col","perfil").eq("id","main").neq("user_id",ME); if(error) throw error;
      let coaches=new Set(); try{ const {data:cs}=await SB.from("coaches").select("user_id"); (cs||[]).forEach(c=>coaches.add(c.user_id)); }catch(e){}
      return data.filter(r=>!coaches.has(r.user_id)).map(r=>({id:r.user_id, data:r.data})); }
    const {data,error}=await SB.from("docs").select("id,data").eq("user_id",p.uid).eq("col",p.col); if(error) throw error; return data;
  }
  const refresh = key => subs.filter(s=>s.key===key || (key.endsWith("|perfil") && s.key==="team")).forEach(s=>load(s.p).then(r=>s.fn(snap(r))).catch(e=>s.err&&s.err(e)));
  let timer=null; const pending=new Set();
  const later = key => { pending.add(key); clearTimeout(timer); timer=setTimeout(()=>{ const ks=[...pending]; pending.clear(); ks.forEach(refresh); }, 250); };
  SB.channel("impulso-datos")
    .on("postgres_changes",{event:"*", schema:"public", table:"docs"}, ev=>{ const r=ev.new&&ev.new.user_id?ev.new:ev.old; if(r&&r.user_id&&r.col) later(`${r.user_id}|${r.col}`); })
    .on("postgres_changes",{event:"*", schema:"public", table:"ejercicios"}, ()=>later("ej"))
    .subscribe();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") [...new Set(subs.map(s=>s.key))].forEach(refresh); });
  const write = async (p, id, data) => {
    if(p.kind==="ej"){ const {error}=await SB.from("ejercicios").upsert({id, data, updated_at:new Date().toISOString()}); if(error) throw error; }
    else { const {error}=await SB.from("docs").upsert({user_id:ME, col:p.col, id, data, updated_at:new Date().toISOString()}); if(error) throw error; }
    refresh(p.key);
  };
  const remove = async (p, id) => {
    const q = p.kind==="ej" ? SB.from("ejercicios").delete().eq("id",id) : SB.from("docs").delete().eq("user_id",ME).eq("col",p.col).eq("id",id);
    const {error}=await q; if(error) throw error; refresh(p.key);
  };
  const collection = path => { const p=parse(path); return {
    add: async d => { const id=newId(); await write(p,id,d); return {id}; },
    doc: id => ({ set: d=>write(p,id,d), delete: ()=>remove(p,id) }),
    onSnapshot: (fn, err) => { const s={key:p.key, p, fn, err}; subs.push(s); load(p).then(r=>fn(snap(r))).catch(e=>err&&err(e)); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; }
  }; };
  return { collection, doc: path => { const s=path.split("/"); return collection(s.slice(0,-1).join("/")).doc(s[s.length-1]); } };
}
/* Fotos y videos de ejercicios en el almacenamiento de Supabase */
const MEDIA_BASE = SB ? `${CFG.supabaseUrl.replace(/\/$/,"")}/storage/v1/object/public/media/` : "";
const sbAssets = SB ? {
  upload: async (blob, o) => { const t=(o&&o.type)||blob.type||"application/octet-stream"; const ext=(t.split("/")[1]||"bin").replace("jpeg","jpg").replace(/[^a-z0-9]/g,"");
    const id=`ej/${newId()}.${ext}`; const {error}=await SB.storage.from("media").upload(id, blob, {contentType:t, upsert:false}); if(error) throw error; return {id, url:MEDIA_BASE+id}; },
  delete: async id => { await SB.storage.from("media").remove([id]); }
} : null;

/* Pantalla de ingreso */
function authScreen(){
  return new Promise(resolve=>{
    const A=$("#auth"); A.hidden=false; let mode="in";
    const draw=(msg)=>{
      A.innerHTML=`<div class="auth-in">
        <div class="auth-brand"><img src="icons/icon-192.png" alt="" width="72" height="72"><h1>Impulso</h1><p>Entrenar para vivir mejor</p></div>
        <div class="seg" role="group" aria-label="Ingreso"><button data-m="in" aria-pressed="${mode==="in"}">Entrar</button><button data-m="up" aria-pressed="${mode==="up"}">Crear cuenta</button></div>
        <form id="auF" class="stack" novalidate>
          ${mode==="up"?`<label class="f">Nombre y apellido<input id="auN" autocomplete="name" required></label>`:""}
          <label class="f">Mail<input id="auE" type="email" inputmode="email" autocomplete="email" required></label>
          ${mode!=="reset"?`<label class="f">Contraseña<input id="auP" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}" minlength="6" required></label>`:""}
          <p class="hint" id="auMsg" role="status">${msg?esc(msg):mode==="up"?"Usá una contraseña de al menos 6 caracteres.":mode==="reset"?"Te mandamos un mail para elegir una contraseña nueva.":""}</p>
          <button class="pill accent" type="submit" style="justify-content:center">${mode==="up"?"Crear mi cuenta":mode==="reset"?"Mandarme el mail":"Entrar"}</button>
        </form>
        ${mode==="in"?`<button class="linkbtn" id="auR">Me olvidé la contraseña</button>`:mode==="reset"?`<button class="linkbtn" id="auB">Volver</button>`:""}
      </div>`;
      A.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; draw(); });
      const r=$("#auR"); if(r) r.onclick=()=>{ mode="reset"; draw(); };
      const bk=$("#auB"); if(bk) bk.onclick=()=>{ mode="in"; draw(); };
      $("#auF").onsubmit=async ev=>{ ev.preventDefault(); const m=$("#auMsg"), btn=ev.target.querySelector("button[type=submit]");
        const email=$("#auE").value.trim(), pass=$("#auP")?$("#auP").value:"";
        if(!/^\S+@\S+\.\S+$/.test(email)){ m.textContent="Revisá el mail."; return; }
        if(mode!=="reset" && pass.length<6){ m.textContent="La contraseña tiene que tener al menos 6 caracteres."; return; }
        btn.disabled=true; m.textContent="Un momento…";
        try{
          if(mode==="reset"){ const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]}); if(error) throw error; m.textContent="Listo. Revisá tu mail (y la carpeta de spam)."; btn.disabled=false; return; }
          if(mode==="up"){ const nombre=$("#auN").value.trim(); if(!nombre){ m.textContent="Escribí tu nombre y apellido."; btn.disabled=false; return; }
            const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{nombre}}}); if(error) throw error;
            if(!data.session){ m.textContent="Te mandamos un mail para confirmar la cuenta. Después volvé y entrá."; btn.disabled=false; return; }
            A.hidden=true; resolve(data.session); return; }
          const {data,error}=await SB.auth.signInWithPassword({email,password:pass}); if(error) throw error; A.hidden=true; resolve(data.session);
        }catch(e){ btn.disabled=false; const t=String(e&&e.message||"");
          m.textContent = /Invalid login/i.test(t)?"Mail o contraseña incorrectos." : /already registered/i.test(t)?"Ese mail ya tiene cuenta. Tocá Entrar." : /rate limit/i.test(t)?"Demasiados intentos. Esperá unos minutos." : /network|fetch/i.test(t)?"Sin conexión. Probá de nuevo.":"No se pudo. Probá de nuevo."; }
      };
    };
    draw();
  });
}
function newPassScreen(){
  const A=$("#auth"); A.hidden=false;
  A.innerHTML=`<div class="auth-in"><div class="auth-brand"><img src="icons/icon-192.png" alt="" width="72" height="72"><h1>Nueva contraseña</h1></div>
    <form id="npF" class="stack"><label class="f">Contraseña nueva<input id="npP" type="password" autocomplete="new-password" minlength="6"></label><p class="hint" id="npM" role="status"></p>
    <button class="pill accent" type="submit" style="justify-content:center">Guardar</button></form></div>`;
  $("#npF").onsubmit=async ev=>{ ev.preventDefault(); const p=$("#npP").value; if(p.length<6){ $("#npM").textContent="Al menos 6 caracteres."; return; }
    const {error}=await SB.auth.updateUser({password:p}); if(error){ $("#npM").textContent="No se pudo. Probá de nuevo."; return; } A.hidden=true; toast("Contraseña cambiada"); };
}
async function signOut(){ try{ await SB.auth.signOut(); }catch(e){} try{ localStorage.removeItem(LS); }catch(e){} location.reload(); }

async function connectDb(){
  if(!SB){ $("#status").textContent="Modo prueba · guardando solo en este celular"; perfilLoaded=true; renderAll(); return; }
  SB.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY") newPassScreen(); });
  let {data:{session}} = await SB.auth.getSession();
  if(!session) session = await authScreen();
  ME = session.user.id; ROLE.uid=null; ROLE.base=""; ROLE.name=(session.user.user_metadata&&session.user.user_metadata.nombre)||"";
  COLS.forEach(c=>state[c]=[]); renderAll();
  setTimeout(()=>{ if(!perfilLoaded){ perfilLoaded=true; renderAll(); } }, 12000);
  try{ const {data}=await SB.rpc("is_coach"); ROLE.coach=!!data; }catch(e){ ROLE.coach=false; }
  db=makeDb(); assets=ROLE.coach?sbAssets:null;
  $("#status").textContent = ROLE.coach ? `Entrenador · ${session.user.email}` : `${session.user.email} · tu entrenador ve tus entrenos`;
  applyRole();
  if(ROLE.coach) watchTeam();
  loadPlan(); watchPlan();
  COLS.forEach(col=>db.collection(cpath(col)).onSnapshot(snap=>{ state[col]=snap.docs.map(x=>({id:x.id,...x.data()})); if(col==="perfil") perfilLoaded=true; renderAll(); },
    ()=>{ $("#status").textContent="Sin conexión. Revisá internet."; }));
}

/* ---------- Perfil y cálculos ---------- */
const profile = () => Object.assign({nombre:"Pick", kcal:2000, mc:40, mg:30, mp:30}, state.perfil.find(x=>x.id==="main")||{});
async function saveProfile(patch){ const p=profile(); const {id,...rest}=p; try{ await setDoc("perfil","main",{...rest,...patch}); }catch(e){ saveErr(e); } }
const carga = s => (s.ejercicios||[]).reduce((a,e)=>a+(e.modo==="tiempo"?0:(e.series||[]).reduce((b,x)=>b+(num(x.kg)||0)*(num(x.reps)||0),0)),0);
const TIME_RE=/segundo|plancha|plank|isometr|hollow|wall-sit|colgad|dead-hang|sentadilla-en-pared/;
const isTimeEx = n => TIME_RE.test(slug(n));
const nSeries = s => (s.ejercicios||[]).reduce((a,e)=>a+(e.series||[]).filter(x=>num(x.reps)).length,0);
const kmOf = s => (s.carrera && num(s.carrera.km)) || 0;
const minOf = s => s.carrera ? ((num(s.carrera.min)||0)+(num(s.carrera.seg)||0)/60) : 0;
function ritmo(km,min){ if(!km||!min) return "–"; const p=min/km; const m=Math.floor(p), sg=Math.round((p-m)*60); return `${m}:${String(sg===60?0:sg).padStart(2,"0")} /km`; }
function tipoOf(s){ const f=nSeries(s)>0, r=kmOf(s)>0; return f&&r?"Híbrido":r?"Resistencia":"Fuerza"; }
const tagOf = t => t==="Híbrido"?"H":t==="Resistencia"?"R":"F";
const sesSorted = () => state.sesiones.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.creado||0)-(a.creado||0));
function racha(){

}
const LEVELS=[[0,"Iniciado Híbrido"],[100,"Híbrido en marcha"],[250,"Híbrido intermedio"],[500,"Híbrido avanzado"],[1000,"Élite híbrida"]];
function puntos(){
  const ses=state.sesiones.length, km=state.sesiones.reduce((a,s)=>a+kmOf(s),0), kg=state.sesiones.reduce((a,s)=>a+carga(s),0);
  return Math.round(ses*5 + km*2 + kg/500 + (state.desafios||[]).length*10);
}
function nivel(p){
  let i=0; LEVELS.forEach((l,k)=>{ if(p>=l[0]) i=k; });
  const next=LEVELS[i+1]; const frac=next? (p-LEVELS[i][0])/(next[0]-LEVELS[i][0]) : 1;
  return {n:i+1, name:LEVELS[i][1], frac, next:next?next[0]:null};
}

const NIV=[["cero","Empiezo de cero","Recién arranco o volví después de mucho"],["medio","Entreno hace un tiempo","Conozco los ejercicios básicos"],["alto","Entreno hace años","Técnica sólida y buena base"]];
const DEPS=[["ninguno","Ninguno"],["padel","Pádel"],["basquet","Básquet"]];
const DEP_LOG=[["padel","Pádel"],["basquet","Básquet"],["futbol","Fútbol"],["tenis","Tenis"],["rugby","Rugby"],["running","Running"],["otro","Otro"]];
const depName = k => (DEP_LOG.find(x=>x[0]===k)||DEPS.find(x=>x[0]===k)||[k,k])[1];
const TARGETS={2:{F:2,C:1,P:0},3:{F:2,C:1,P:1},4:{F:3,C:1,P:1},5:{F:3,C:2,P:1},6:{F:3,C:2,P:2}};

function plan(){ const p=profile(); return {obj:p.obj||"salud", niv:p.niv||"medio", dias:p.dias||3, dep:p.dep||"ninguno"}; }
function catsOf(s){
  if(Array.isArray(s.cat) && s.cat.length) return s.cat;
  if(s.tipo==="Deporte") return ["S"];
  const t=tipoOf(s); return t==="Híbrido"?["F","C"]:t==="Resistencia"?["C"]:["F"];
}
const monday = d => addDays(d, -((pd(d).getDay()+6)%7));
function weekSes(d){ const m=monday(d), e=addDays(m,6); return state.sesiones.filter(s=>s.fecha>=m && s.fecha<=e); }
function weekCount(d){ const c={F:0,C:0,P:0,S:0}; weekSes(d).forEach(s=>catsOf(s).forEach(k=>{ if(c[k]!=null) c[k]++; })); return c; }
const sesMin = s => s.duracion ? s.duracion/60 : (s.tipo==="Deporte"?60:45);
const sesLoad = s => Math.round(sesMin(s) * (s.rpe||6));

/* bancos de ejercicios: base de salud + bloques por deporte */
const SETS={cero:{s:2,rir:3},medio:{s:3,rir:2},alto:{s:4,rir:1}};
function bank(niv){
  const k=SETS[niv]||SETS.medio, n=(name,r,extra)=>Object.assign({n:name,s:k.s,r,rir:k.rir},extra||{});
  return {
    fA:[n("Sentadilla goblet","10-12"),n("Press plano con mancuernas","8-12"),n("Remo con mancuerna","10-12"),n("Peso muerto rumano","8-10"),n("Press militar con mancuernas","8-12"),n("Plancha (segundos)","30-45",{rir:undefined})],
    fB:[n(niv==="cero"?"Sentadilla goblet":"Peso muerto","6-8"),n("Sentadilla búlgara","8-10"),n(niv==="cero"?"Remo T":"Dominadas","6-10"),n("Press inclinado en multipower","8-12"),n("Elevaciones laterales","12-15"),n("Face pull","15-20"),n("Plancha lateral (segundos)","20-30",{rir:undefined})],
    plio: niv==="cero" ? [n("Aterrizajes desde cajón bajo","5",{rir:"Técnica"}),n("Saltos al cajón bajo","5",{rir:"Técnica"})]
                       : [n("Tuck jumps","6",{rir:"Máx"}),n("Saltos laterales","8",{rir:"Máx"}),n("Saltos al cajón","5",{rir:"Máx"})],
    padel:[n("Desplazamientos laterales con banda","10 c/lado",{rir:undefined}),n("Pallof press (antirrotación)","10 c/lado"),n("Rotación externa de hombro con banda","15"),n("Muñeca con mancuerna (antebrazo)","15"),n("Frenadas y cambios de dirección","6",{rir:"Máx",pl:true})],
    basquet:[n("Aterrizajes desde cajón","5",{rir:"Técnica",pl:true}),n("Saltos a una pierna","5 c/pierna",{rir:"Máx",pl:true}),n("Cambios de dirección 5-10-5","4",{rir:"Máx",pl:true}),n("Gemelos a una pierna","12 c/pierna"),n("Puente de glúteo a una pierna","10 c/pierna")],
    movi:[n("Movilidad de cadera 90/90","8 c/lado",{rir:undefined}),n("Gato-camello","10",{rir:undefined}),n("Puente de glúteo","12"),n("Dead bug","10 c/lado"),n("Plancha (segundos)","30-40",{rir:undefined}),n("Plancha lateral (segundos)","20-30",{rir:undefined})],
    km: niv==="cero"?2.5:niv==="alto"?7:5
  };
}
function sessionTpl(kind, opts){
  const pl=plan(), B=bank(pl.niv), o=opts||{};
  const sport = pl.dep!=="ninguno" ? B[pl.dep] : null;
  if(kind==="fuerza"){
    const fCount=state.sesiones.filter(s=>catsOf(s).includes("F")).length, base=(fCount%2===0)?B.fA:B.fB, letra=(fCount%2===0)?"A":"B";
    const sp = sport ? sport.filter(x=>!(o.noJump && x.pl)) : [];
    const nSp = !sport ? 0 : o.plio ? 1 : (pl.obj==="deporte"?3:2), nPl = o.plio?2:0;
    const items=[...B.plio.slice(0,nPl), ...base.slice(0, Math.max(5, 9-nPl-nSp)), ...sp.slice(0,nSp)];
    return {key:`fuerza-${letra}-${o.plio?"p":""}`, nombre:`Fuerza ${letra}${o.plio?" + pliometría":""}`, items, cat:o.plio?["F","P"]:["F"]};
  }
  if(kind==="carrera") return {key:"carrera", nombre: pl.niv==="cero"?"Caminar y trotar":"Carrera continua", items:[{km:B.km}], cat:["C"]};
  if(kind==="especifico" && sport) return {key:"esp-"+pl.dep, nombre:`Específico ${depName(pl.dep)}`, items:[...sport, ...B.plio.slice(0,1)], cat:["P"]};
  return {key:"movi", nombre:"Movilidad y core", items:B.movi, cat:[]};
}
/* lo que se sugiere hoy, según la semana y lo que hiciste ayer */
function hoyOptions(){
  const pl=plan(), T=TARGETS[pl.dias]||TARGETS[3], t=today(), c=weekCount(t);
  const rem={F:Math.max(0,T.F-c.F), C:Math.max(0,T.C-c.C-c.S), P:Math.max(0,T.P-c.P)};
  const ayer=state.sesiones.filter(s=>s.fecha===addDays(t,-1));
  const ayerDep=ayer.find(s=>s.tipo==="Deporte"), ayerRun=ayer.some(s=>catsOf(s).includes("C")&&s.tipo!=="Deporte");
  const ayerDuro=ayer.some(s=>(s.rpe||0)>=8), saltosAyer=ayer.some(s=>catsOf(s).includes("P")) || (ayerDep && /basquet|voley|futbol/.test(ayerDep.deporte||""));
  const hoyHecho=state.sesiones.filter(s=>s.fecha===t);
  const opts=[];
  let why="";
  if(ayerDep) why=`Ayer jugaste ${depName(ayerDep.deporte).toLowerCase()}`;
  else if(ayerRun) why="Ayer corriste";
  else if(ayerDuro) why="Ayer entrenaste fuerte";
  const hoyF=hoyHecho.some(s=>catsOf(s).includes("F")), hoyC=hoyHecho.some(s=>catsOf(s).includes("C")||s.tipo==="Deporte");
  if(rem.F>0 && !hoyF){
    const conPlio = rem.P>0 && !saltosAyer && !ayerDuro;
    opts.push({tpl:sessionTpl("fuerza",{plio:conPlio, noJump:saltosAyer}), why: why ? `${why}: hoy fuerza${conPlio?" y saltos":""}, sin correr.` : `Te ${rem.F===1?"falta 1 sesión":"faltan "+rem.F+" sesiones"} de fuerza esta semana.`});
  }
  if(rem.C>0 && !hoyC && !ayerRun && !(ayerDep && ayerDuro)){
    opts.push({tpl:sessionTpl("carrera"), why: hoyF ? "Ya hiciste fuerza: si tenés ganas, la carrera va bien a la tarde o a la noche." : rem.F>0 ? "Podés hacerla a la tarde o a la noche, separada de la fuerza." : `Te ${rem.C===1?"falta 1":"faltan "+rem.C} de cardio esta semana.`});
  }
  if(opts.length<2 && pl.dep!=="ninguno" && rem.P>0 && !saltosAyer) opts.push({tpl:sessionTpl("especifico"), why:`Trabajo específico para ${depName(pl.dep).toLowerCase()}: saltos, frenadas y cambios de dirección.`});
  if(opts.length<2) opts.push({tpl:sessionTpl("movilidad"), why: hoyF ? "Ya entrenaste fuerza hoy. Si querés sumar, algo suave para recuperar." : (why?why+". ":"") + "Algo suave para recuperar y sumar salud sin cargar."});
  const done = rem.F===0 && rem.C===0 && rem.P===0;
  return {opts:opts.slice(0,2), c, T, done, hoyHecho};
}
function loadWeeks(n){
  const out=[]; let m=monday(today());

  return out;
}

function nutriProgreso(B,p){
  const goal=p.kcal||0, t=today(), days=[...Array(7)].map((_,i)=>addDays(t,i-6));
  const vals=days.map(kcalOn), withData=vals.filter(x=>x>0);
  const avg=withData.length?withData.reduce((a,b)=>a+b,0)/withData.length:0;
  const inGoal=vals.filter(x=>goal&&x>0&&Math.abs(x-goal)<=goal*0.1).length;
  const a=vals.slice(0,4).filter(x=>x>0), b=vals.slice(4).filter(x=>x>0);
  const ma=a.length?a.reduce((x,y)=>x+y,0)/a.length:0, mb=b.length?b.reduce((x,y)=>x+y,0)/b.length:0;
  let tr="Estable", trs="Consumo estable"; if(ma&&mb){ if(mb>ma*1.08){tr="Subiendo";trs="Comés más que días atrás";} else if(mb<ma*0.92){tr="Bajando";trs="Comés menos que días atrás";} } else if(!withData.length){ trs="Sin registros todavía"; }
  const W=560,H=230,L=62,R=10,T=16,Bm=34, mx=Math.max(goal*1.25, ...vals, 100);
  const bw=(W-L-R)/7, sy=v=>H-Bm-(v/mx)*(H-T-Bm);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías de los últimos 7 días">`;
  [0,0.5,1].forEach(f=>{ const v=mx*f; svg+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text class="lbl" x="${L-6}" y="${sy(v)+4}" text-anchor="end">${fmt(v,0)}</text>`; });
  if(goal) svg+=`<line class="goal" x1="${L}" x2="${W-R}" y1="${sy(goal)}" y2="${sy(goal)}"/>`;
  vals.forEach((v,i)=>{ const x=L+i*bw+bw*0.2, w=bw*0.6; if(v>0) svg+=`<rect class="bar ${goal&&v>goal*1.1?"over":""}" x="${x}" y="${sy(v)}" width="${w}" height="${H-Bm-sy(v)}" rx="6"/>`; else svg+=`<circle cx="${x+w/2}" cy="${H-Bm-3}" r="4" fill="var(--soft)"/>`;
    svg+=`<text class="lbl" x="${x+w/2}" y="${H-8}" text-anchor="middle">${pd(days[i]).toLocaleDateString("es-AR",{weekday:"short"}).replace(".","")}</text>`; });
  svg+="</svg>";
  const mxv=Math.max(...vals, goal, 1);
  B.innerHTML = `<section class="card"><div class="stats4">
      <div><span>Promedio diario</span><b>${fmt(avg,0)}</b><span>kcal</span></div>
      <div><span>Objetivo</span><b>${fmt(goal,0)}</b><span>kcal</span></div>
      <div><span>Días en meta</span><b>${inGoal}</b><span>de 7</span></div>
      <div><span>Tendencia</span><b style="font-size:30px">${tr}</b><span>${trs}</span></div>
    </div></section>
  <section class="card"><h3>Calorías consumidas · Últimos 7 días</h3><div class="chart" style="margin-top:10px">${svg}</div>
    <p class="hint" style="margin-top:6px">La línea punteada es tu objetivo. Un día cuenta como en meta si queda a menos de 10% del objetivo.</p></section>
  <section class="card"><h3 style="margin-bottom:6px">Resumen por día</h3>
    ${days.slice().reverse().map((d,i)=>{ const v=vals[6-i]; return `<div class="dbar"><span>${wName(d)}</span><span class="tr"><i style="width:${v/mxv*100}%"></i></span><span class="n">${fmt(v,0)} kcal</span></div>`; }).join("")}
  </section>`;
}

function lineChart(vals, labels, unit){
  const W=560,H=220,L=62,R=14,T=16,Bm=32, mn=Math.min(...vals), mx=Math.max(...vals), pad=(mx-mn)*0.25||1;
  const y0=mn-pad,y1=mx+pad,n=vals.length, sx=i=>L+(n===1?0.5:i/(n-1))*(W-L-R), sy=v=>H-Bm-(v-y0)/(y1-y0)*(H-T-Bm);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${unit}">`;
  [0,0.5,1].forEach(f=>{ const v=y0+(y1-y0)*f; s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}"/><text class="lbl" x="${L-6}" y="${sy(v)+4}" text-anchor="end">${fmt(v,1)}</text>`; });
  if(n>1) s+=`<polyline class="ln" points="${vals.map((v,i)=>sx(i)+","+sy(v)).join(" ")}"/>`;
  vals.forEach((v,i)=>s+=`<circle class="pt" cx="${sx(i)}" cy="${sy(v)}" r="${i===n-1?6:4}"/>`);
  const st=Math.max(1,Math.ceil(n/6)); labels.forEach((l,i)=>{ if(i%st===0||i===n-1) s+=`<text class="lbl" x="${sx(i)}" y="${H-6}" text-anchor="middle">${l}</text>`; });
  return s+"</svg>";
}

function shrink(file, max, q){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",q)); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("img")); }; im.src=u; });
}

function parseItems(txt){
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const k=l.match(/(\d+(?:[.,]\d+)?)\s*km/i); if(k && /corr|trot|run|km/i.test(l) && !/\d+\s*[x×]\s*\d+/i.test(l)) return {km:num(k[1])};
    const m=l.match(/^(.*?)\s+(\d+)\s*[x×]\s*(\d+(?:\s*-\s*\d+)?)(?:\s+(\d+(?:[.,]\d+)?)\s*kg)?(?:\s+rir\s*(\S+))?/i);
    if(m) return {n:m[1].trim(), s:+m[2], r:m[3].replace(/\s/g,""), kg:m[4]?num(m[4]):undefined, rir:m[5]||undefined};
    return {n:l, s:3, r:10};
  });
}

function openProgDetail(pid, week){
  const p0=state.programas.find(x=>x.id===pid); if(!p0) return;
  const o={title:p0.nombre, wk: week || progPos(p0).sem, render:B=>{ o.B=B; draw(); }, live:()=>{ if(o.B) draw(); }};
  const draw=()=>{
    const p=state.programas.find(x=>x.id===pid); if(!p){ closeSheet(); return; }
    const B=o.B, pos=progPos(p), done=progDone(p), w=o.wk, [wt,ws]=weekT(w);
    B.innerHTML=`<div class="pban">${I.mark}<span class="chip">${I.cal.replace('<svg','<svg class="ico" style="width:16px;height:16px"')} Semana ${w}</span><h2>${esc(wt)}</h2><p>${esc(ws)}</p></div>
      <div class="wknav"><button class="iconbtn" id="wkP" aria-label="Semana anterior" ${w<=1?"disabled":""}>${I.arrowL}</button><strong>Semana ${w}${w===pos.sem?" · actual":""}</strong><button class="iconbtn" id="wkN" aria-label="Semana siguiente">${I.arrowR}</button></div>
      ${(p.dias||[]).map((d,i)=>{ const ses=done.get(w+"."+i), isNext=(w===pos.sem&&i===pos.idx), [tn,tc]=dayType(d);
        const tico = tc==="f"?I.dumb:I.run;
        return `<article class="dcard ${isNext?"next":""}">
          <div class="dtop"><span class="chip">Día ${i+1}</span><span class="chip ty ${tc}">${tico.replace('<svg','<svg class="ico" style="width:15px;height:15px"')} ${tn}</span>${ses?`<span class="chip ok">✓ Hecho</span>`:isNext?`<span class="chip ok">Siguiente</span>`:""}${ses&&ses.carreraPend?`<span class="chip" style="color:var(--blue);border-color:var(--blue)">Carrera pendiente</span>`:""}</div>
          <div class="dmid"><button class="dtxt" data-dt="${i}"><b>${esc(d.nombre||"Día "+(i+1))}</b><small>${esc(dayDesc(d))}${ses?` · hecho el ${fDayShort(ses.fecha)}`:""}</small></button>
            <button class="go ${ses?"done":isNext?"":"ghost"}" data-ds="${i}" aria-label="${ses?"Repetir":"Empezar"} ${esc(d.nombre||"día "+(i+1))}">${ses?'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>'}</button></div>
        </article>`; }).join("")}
      <p class="hint">Tocá el nombre de un día hecho para ver o editar la sesión. El botón circular la repite o la empieza.</p>`;
    $("#wkP").onclick=()=>{ if(o.wk>1){ o.wk--; draw(); } };
    $("#wkN").onclick=()=>{ o.wk++; draw(); };
    const start=i=>openSesion({fecha:today(), prog:p, semana:w, diaIdx:i, back:()=>openProgDetail(pid,w)});
    B.querySelectorAll("[data-ds]").forEach(b=>b.onclick=()=>start(+b.dataset.ds));
    B.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.dt, ses=done.get(w+"."+i); if(ses) openSesion({from:ses, back:()=>openProgDetail(pid,w)}); else start(i); });
  };
  openSheet(o);
}

              ${T?`<button class="tmr ${ed.iso&&ed.iso.a===i&&ed.iso.k===k?"run":""}" data-iso="${i}.${k}" aria-label="Cronómetro de la serie ${k+1}">${ed.iso&&ed.iso.a===i&&ed.iso.k===k?`<b data-isot>${Math.max(0,Math.ceil((ed.iso.end-Date.now())/1000))}</b>`:'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>'}</button>`
                 :`<input type="text" inputmode="numeric" data-ri="${i}.${k}" value="${esc(x.rir??"")}" placeholder="${esc(x.robj||"–")}" aria-label="RIR serie ${k+1}">`}
              <button class="ck ${x.ok?"on":""}" data-ck="${i}.${k}" aria-label="Serie hecha" aria-pressed="${x.ok}">✓</button></div>`; }).join("")}
          <div class="row" style="justify-content:space-between;margin-top:6px"><button class="addset" data-ads="${i}">+ Añadir serie</button><button class="del" data-rme="${i}">Quitar ejercicio</button></div>

        </section>`; }).join("")}
        <button class="pill ghost" id="sAddE" style="justify-content:center">${I.plus} Agregar ejercicio</button>
        <div class="group"><div class="row" style="justify-content:space-between"><h3>Carrera</h3><div class="row">${ed.live&&ed.carrera.on&&!ed.carrera.later&&ed.ejercicios.length&&!ed.rt.run&&!ed.rt.acc?`<button class="pill accent sm" id="sLater">Más tarde</button>`:""}${ed.carrera.later?"":`<button class="pill ${ed.carrera.on?"ghost":"accent"} sm" id="sRunT">${ed.carrera.on?"Quitar":"Agregar carrera"}</button>`}</div></div>

            <div class="grid3"><label class="f">Distancia<div class="unitbox"><input id="rKm" type="number" inputmode="decimal" step="0.01" value="${ed.carrera.km??""}"><span>km</span></div></label>

            ${ed.live?`<p class="hint">El cronómetro de trabajo completa los minutos y segundos cuando lo parás.</p>`:""}`
            :`<p class="hint">Sumá km y tiempo para calcular el ritmo.</p>`}</div>
        <label class="f">Notas<textarea id="sNt" rows="2" placeholder="Sensaciones, clima, molestias…">${esc(ed.notas)}</textarea></label>
        <div id="medBox"></div>`;
      bind(); sum(); paint();
    };
    const bind=()=>{
      $("#sF").oninput=e=>{ed.fecha=e.target.value;persist();}; $("#sN").oninput=e=>{ed.nombre=e.target.value;persist();}; $("#sNt").oninput=e=>{ed.notas=e.target.value;persist();};
      B.querySelectorAll("[data-en]").forEach(i=>{ i.oninput=()=>{ ed.ejercicios[+i.dataset.en].nombre=i.value; persist(); }; i.onchange=()=>draw(); });
      const setF=(attr,key,re)=>B.querySelectorAll(`[${attr}]`).forEach(i=>i.oninput=()=>{ const [a,b]=at(i.getAttribute(attr)); ed.ejercicios[a].series[b][key]=i.value; persist(); if(re) sum(); });
