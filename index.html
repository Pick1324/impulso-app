      B.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ const [a,m]=b.dataset.mode.split("."), e=ed.ejercicios[+a]; if(e.modo===m) return; e.modo=m;
        e.series.forEach(x=>{ if(!x.ok){ x.obj = m==="tiempo" ? "30-45" : "10-12"; } }); persist(); draw(); });
      B.querySelectorAll("[data-iso]").forEach(b=>b.onclick=()=>{ wakeAudio(); const [a,k]=at(b.dataset.iso), x=ed.ejercicios[a].series[k];
        if(ed.iso && ed.iso.a===a && ed.iso.k===k){ const done=Math.round((Date.now()-ed.iso.t0)/1000); ed.iso=null; x.reps=String(Math.max(1,done)); x.ok=true; beep(1200,0.2,1);
          if(ed.live){ const len=restOf(ed.ejercicios[a]); ed.rest={end:Date.now()+len*1000, len}; } persist(); draw(); return; }
        const secs = num(x.reps) || firstNum(x.obj) || 30;
        ed.iso={a,k,t0:Date.now()+3000,end:Date.now()+3000+secs*1000,secs}; beep(880,0.12,3); persist(); draw(); });
      B.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ const [a,k]=at(b.dataset.st), x=ed.ejercicios[a].series[k]; x.tipo = x.tipo===""?"W":x.tipo==="W"?"F":""; persist(); draw(); });
      B.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>{ wakeAudio(); const [a,k]=at(b.dataset.ck), x=ed.ejercicios[a].series[k]; x.ok=!x.ok;
        if(x.ok){ if(x.reps==="" && firstNum(x.obj)!=null) x.reps=String(firstNum(x.obj)); if(x.kg==="" && x.pkg!=="") x.kg=String(x.pkg);
          if(ed.live){ const len=restOf(ed.ejercicios[a]); ed.rest={end:Date.now()+len*1000, len}; } }
        persist(); draw(); });
      B.querySelectorAll("[data-ads]").forEach(b=>b.onclick=()=>{ const s=ed.ejercicios[+b.dataset.ads].series, l=s[s.length-1]||{}; s.push(newSeries({obj:l.obj||"", robj:l.robj||"", pkg:l.kg||l.pkg||""})); persist(); draw(); });
      B.querySelectorAll("[data-rme]").forEach(b=>b.onclick=twoTap(b,"¿Seguro?",()=>{ ed.ejercicios.splice(+b.dataset.rme,1); persist(); draw(); }));
      B.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ const e=ed.ejercicios[+b.dataset.ed]; if(!slug(e.nombre)){ toast("Poné primero el nombre del ejercicio"); return; } e.editDesc=true; draw(); const i=B.querySelector(`[data-dsc="${b.dataset.ed}"]`); if(i) i.focus(); });
      B.querySelectorAll("[data-dok]").forEach(b=>b.onclick=async()=>{ const i=+b.dataset.dok, e=ed.ejercicios[i], v=B.querySelector(`[data-dsc="${i}"]`).value.trim(); delete e.editDesc; try{ await saveExInfo(e.nombre,{desc:v}); }catch(err){ saveErr(err); } draw(); });
      B.querySelectorAll("[data-rest]").forEach(b=>b.onclick=async()=>{ const e=ed.ejercicios[+b.dataset.rest]; if(!slug(e.nombre)){ toast("Poné primero el nombre del ejercicio"); return; }
        if(e.desc || !ROLE.coach){ const c0=restOf(e); e.desc=RESTS[(RESTS.indexOf(c0)+1)%RESTS.length]||90; persist(); draw(); return; }
        const cur=exInfo(e.nombre).descanso, nx=RESTS[(RESTS.indexOf(cur)+1)%RESTS.length]||90; try{ await saveExInfo(e.nombre,{descanso:nx}); }catch(err){ saveErr(err); } draw(); });
      B.querySelectorAll("[data-med]").forEach(b=>b.onclick=()=>mediaBox(+b.dataset.med));
      B.querySelectorAll("[data-cqe]").forEach(b=>b.onclick=()=>openConsulta({ej:ed.ejercicios[+b.dataset.cqe].nombre, ses:ed.nombre}));
      $("#sAddE").onclick=()=>openPicker(names=>{
        if(names===null){ ed.ejercicios.push({nombre:"",modo:"reps",series:[newSeries()]}); persist(); draw(); const l=B.querySelectorAll("[data-en]"); if(l.length) l[l.length-1].focus(); return; }
        const k=SETS[plan().niv]||SETS.medio;
        names.forEach(n=>{ const T=isTimeEx(n); ed.ejercicios.push(exFromItem({n, s:k.s, r:T?"30-45":"10-12", rir:T?undefined:k.rir})); });
        persist(); draw(); toast(names.length===1?`${names[0]} agregado`:`${names.length} ejercicios agregados`);
        const all=B.querySelectorAll(".exb"); if(all.length) all[all.length-1].scrollIntoView({behavior:"smooth",block:"start"}); });
      const rtg=$("#sRunT"); if(rtg) rtg.onclick=()=>{ ed.carrera.on=!ed.carrera.on; persist(); draw(); if(ed.carrera.on) $("#rKm").focus(); };
      const lt=$("#sLater"); if(lt) lt.onclick=()=>{ ed.carrera.later=true; persist(); draw(); toast("Carrera para más tarde"); };
      const nw=$("#sNow"); if(nw) nw.onclick=()=>{ ed.carrera.later=false; persist(); draw(); };
      if(ed.carrera.on && !ed.carrera.later){ $("#rKm").oninput=e=>{ed.carrera.km=e.target.value;persist();sum();}; $("#rMin").oninput=e=>{ed.carrera.min=e.target.value;persist();sum();}; $("#rSeg").oninput=e=>{ed.carrera.seg=e.target.value;persist();sum();};
        const rb=$("#rtB"); if(rb) rb.onclick=()=>{ wakeAudio(); const t=ed.rt; if(t.run){ t.acc=elapsed(t); t.run=false; t.t0=null; const s=Math.round(t.acc/1000); ed.carrera.min=String(Math.floor(s/60)); ed.carrera.seg=String(s%60); beep(1200,0.2,1); }
          else { t.t0=Date.now(); t.run=true; beep(1320,0.3,1); } persist(); draw(); }; }
      if(ed.live){
        $("#clkT").onclick=()=>{ wakeAudio(); const c=ed.clk; if(c.run){ c.acc=elapsed(c); c.run=false; c.t0=null; } else { c.t0=Date.now(); c.run=true; } persist(); paint(); };
        const r=$("#clkR"); r.onclick=twoTap(r,"↺?",()=>{ ed.clk={acc:0,t0:ed.clk.run?Date.now():null,run:ed.clk.run}; persist(); paint(); });
        $("#rM").onclick=()=>{ if(ed.rest.end){ ed.rest.end-=15000; persist(); paint(); } };
        $("#rP").onclick=()=>{ if(ed.rest.end){ ed.rest.end+=15000; ed.rest.len+=15; persist(); paint(); } };
        $("#rS").onclick=()=>{ ed.rest={end:null,len:0}; persist(); paint(); };
      }
    };
    const paint=()=>{
      if(ed.iso){ const t=B.querySelector("[data-isot]"), now=Date.now();
        if(t){ t.textContent = now<ed.iso.t0 ? "–"+Math.ceil((ed.iso.t0-now)/1000) : Math.max(0,Math.ceil((ed.iso.end-now)/1000)); }
        if(!ed.iso.go && now>=ed.iso.t0){ ed.iso.go=true; beep(1320,0.3,1); }
        if(now>=ed.iso.end){ const {a,k,secs}=ed.iso, x=ed.ejercicios[a].series[k]; ed.iso=null; x.reps=String(secs); x.ok=true; beep(1200,0.28,2); toast("¡Tiempo!");
          if(ed.live){ const len=restOf(ed.ejercicios[a]); ed.rest={end:Date.now()+len*1000, len}; } persist(); draw(); return; } }
      if(!ed.live) return;
      if(ui.sesTok!==tok){ clearInterval(tick); return; }
      const c=$("#clk"); if(!c) return;
      c.textContent=clock(elapsed(ed.clk)/1000);
      $("#clkT").innerHTML = ed.clk.run ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>';
      const rt=$("#rtT"); if(rt) rt.textContent=clock(elapsed(ed.rt)/1000);
      const bar=$("#restBar"), line=$("#restLine");
      if(ed.rest.end){ const left=(ed.rest.end-Date.now())/1000;
        if(left<=0){ ed.rest={end:null,len:0}; persist(); beep(1200,0.28,2); toast("¡Terminó el descanso!"); bar.hidden=true; line.hidden=true; return; }
        bar.hidden=false; line.hidden=false; $("#restT").textContent=mmss(left); $("#restFill").style.width=Math.max(0,Math.min(100,left/ed.rest.len*100))+"%"; }
      else { bar.hidden=true; line.hidden=true; }
    };
    const mediaBox=i=>{
      const e=ed.ejercicios[i]; if(!slug(e.nombre)){ toast("Poné primero el nombre del ejercicio"); return; }
      const box=$("#medBox"), inf=exInfo(e.nombre), src=mediaSrc(inf);
      box.innerHTML=`<div class="medov" role="dialog" aria-label="Foto o video de ${esc(e.nombre)}"><div class="medcard ${ROLE.coach?"":"ro"}">
        <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>${esc(e.nombre)}</h3><button class="iconbtn" id="mdX" aria-label="Cerrar">✕</button></div>
        ${src?(inf.mediaType==="video"?`<video src="${src}" controls playsinline loop autoplay muted></video>`:`<img src="${src}" alt="Foto de ${esc(e.nombre)}">`):(patternOf(e.nombre)?`<div class="medanim">${animSVG(patternOf(e.nombre),true)}</div><p class="hint">Figura de guía del movimiento. Podés reemplazarla por tu propia foto o video.</p>`:`<div class="empty">${I.camera}<b>Sin foto ni video</b><span class="hint">Subí una foto o un video corto de cómo se hace, o pegá un link.</span></div>`)}
        <label class="pill accent" style="justify-content:center;position:relative">${I.camera} ${src?"Cambiar":"Subir"} foto o video<input id="mdF" type="file" accept="image/*,video/*" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Elegir foto o video"></label>
        <p class="hint" id="mdMsg">${assets?"Fotos, GIF animados o videos de hasta 20 MB. Mejor cortos, de 10 a 20 segundos.":"En este dispositivo se pueden guardar fotos y GIF livianos. Para videos, pegá un link."}</p>
        <label class="f">Link de video (YouTube u otro)<div class="row" style="flex-wrap:nowrap"><input id="mdL" type="url" inputmode="url" value="${esc(inf.link)}" placeholder="https://…"><button class="pill ghost sm" id="mdLs">Guardar</button></div></label>
        <a class="pill dark" href="${esc(videoHref(e.nombre))}" target="_blank" rel="noopener" style="justify-content:center;text-decoration:none">▶ ${(()=>{ const v=videoOf(e.nombre); return v.kind==="own"?"Abrir tu video":v.kind==="pe"?"Ver video de Powerexplosive":"Buscar la técnica en YouTube"; })()}</a>
        ${src?`<button class="del" id="mdDel" style="align-self:center">Quitar foto o video</button>`:""}
      </div></div>`;
      $("#mdX").onclick=()=>{ box.innerHTML=""; };
      $("#mdLs").onclick=async()=>{ const v=$("#mdL").value.trim(); if(v && !/^https?:\/\//i.test(v)){ toast("El link tiene que empezar con https://"); return; } try{ await saveExInfo(e.nombre,{link:v}); toast(v?"Link guardado":"Link quitado"); draw(); mediaBox(i); }catch(err){ saveErr(err); } };
      const del=$("#mdDel"); if(del) del.onclick=twoTap(del,"Tocá de nuevo para quitar",async()=>{ const old=inf.mediaId; try{ await saveExInfo(e.nombre,{mediaId:null,mediaType:null,mediaData:null}); if(old&&assets){ try{ await assets.delete(old); }catch(x){} } toast("Quitado"); draw(); mediaBox(i); }catch(err){ saveErr(err); } });
      $("#mdF").onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; const isV=/^video\//.test(f.type), msg=$("#mdMsg");
        try{
          if(assets){ if(f.size>20*1024*1024){ toast("El archivo pesa más de 20 MB. Probá con uno más corto."); return; }
            msg.textContent="Subiendo…"; const isG=f.type==="image/gif"; const up = (isV||isG) ? f : await shrinkBlob(f, 1100, 0.8);
            const r=await assets.upload(up, {type: isV ? (f.type||"video/mp4") : isG ? "image/gif" : "image/jpeg"}); const old=inf.mediaId;
            await saveExInfo(e.nombre,{mediaId:r.id, mediaType:isV?"video":"image", mediaData:null}); if(old){ try{ await assets.delete(old); }catch(x){} } }
          else { if(isV){ toast("Acá no se pueden guardar videos. Pegá un link de YouTube."); return; }
            let d; if(f.type==="image/gif"){ if(f.size>180*1024){ toast("Ese GIF es muy pesado para guardarlo acá (máx. 180 KB). Probá con uno más liviano o con un link."); return; } d=await new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=ko; r.readAsDataURL(f); }); }
            else d=await shrink(f, 600, 0.72);
            await saveExInfo(e.nombre,{mediaData:d, mediaType:"image", mediaId:null}); }
          toast("Guardado"); draw(); mediaBox(i);
        }catch(err){ msg.textContent=err&&err.code==="quota_exceeded"?"Se llenó el espacio de archivos. Quitá alguno viejo.":"No se pudo subir. Probá de nuevo."; }
      };
    };
    const build=()=>{ const ej=ed.ejercicios.map(e=>({nombre:e.nombre.trim()||"Ejercicio", modo:e.modo||"reps", series:e.series.map(x=>{
          const reps=num(x.reps) ?? (x.ok?firstNum(x.obj):null); const kg=num(x.kg) ?? (x.ok?num(x.pkg):null);
          return reps ? {kg:kg||0, reps, rir:String(x.rir||"").trim()||null, tipo:x.tipo||null} : null; }).filter(Boolean)})).filter(e=>e.series.length);
      const later=ed.carrera.on&&ed.carrera.later;
      const car=!later&&ed.carrera.on&&num(ed.carrera.km)?{km:num(ed.carrera.km), min:num(ed.carrera.min)||0, seg:num(ed.carrera.seg)||0}:null;

function shrinkBlob(file, max, q){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",q); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("img")); }; im.src=u; });
}

    {n:"Burpees en 5 minutos", m:"amrap", sec:300, u:"reps", d:"Todos los burpees que puedas en 5 minutos, manteniendo el ritmo.", pat:"burpee"},
    {n:"3 km a fondo", m:"time", u:"tiempo", d:"Después de entrar en calor, corré 3 km lo más rápido que puedas.", pat:"jump"}]}
];
const GOAL=0.25;
const trk = id => TRACKS.find(t=>t.id===id);
const better = (m,a,b) => m==="time" ? a<b : a>b;
const fmtV = (lv,v) => lv.m==="time" ? clock(v).replace(/^00:/,"") : lv.m==="hold" ? `${Math.round(v)} s` : `${Math.round(v)} ${lv.u}`;
const grip = () => profile().agarre||"sup";
const tkey = id => trk(id).grips ? `${id}:${grip()}` : id;
const gripOf = t => t.grips ? t.grips.find(g=>g.id===grip())||t.grips[0] : null;
function trackLevel(id){ return (profile().nivDes||{})[tkey(id)]||0; }
function attempts(id, l){ const t=trk(id); return state.desafios.filter(x=>x.track===id && (!t.grips || (x.agarre||"sup")===grip()) && (l==null || x.nivel===l)).sort((a,b)=>(a.fecha+String(a.creado||0)).localeCompare(b.fecha+String(b.creado||0))); }
function trackStat(id){
  const l=trackLevel(id), t=trk(id), g=gripOf(t), at=attempts(id,l);
  const lv = g ? {...t.lv[l], n:`${t.lv[l].n} · toma ${g.n.toLowerCase()}`} : t.lv[l];
  if(!at.length) return {l,lv,at,first:null,best:null,last:null,target:null,gain:0,ready:false};
  const first=at[0].v, best=at.reduce((a,x)=>better(lv.m,x.v,a)?x.v:a, at[0].v), last=at[at.length-1];
  const gain = lv.m==="time" ? (first-best)/first : (best-first)/first;
  let target;
  if(lv.m==="time") target=Math.max(1, best-Math.max(3,Math.round(best*0.02)));
  else if(lv.m==="hold") target=best+5;
  else target=Math.max(best+1, Math.round(best*1.05));
  const goal = lv.m==="time" ? Math.round(first*(1-GOAL*0.4)) : Math.ceil(first*(1+GOAL));
  const ready = at.length>=2 && (lv.m==="time" ? gain>=GOAL*0.4 : gain>=GOAL);
  return {l,lv,at,first,best,last,target,gain,goal,ready};
}
function activeTrack(){ return profile().desafio || null; }
function fabState(){ const f=$("#fab"); if(!f) return; const id=activeTrack(); const done=!!id && state.desafios.some(x=>x.track===id && x.fecha===today());
  f.classList.toggle("done",done); f.querySelector("span").textContent=done?"Hecho ✓":"Desafío"; f.hidden=!!ui.sheet || ui.tab==="equipo"; }
function openDesafio(pick){
  const id = pick ? null : activeTrack();
  if(!id) return openTrackPicker();
  const t=trk(id); let S=trackStat(id); const lv=S.lv;
  const st={run:false,t0:0,acc:0,cnt:0}; let tk=null;
  const lastDays = S.last ? Math.round((pd(today())-pd(S.last.fecha))/864e5) : null;
  openSheet({title:"Tu desafío", footer:`<button class="pill ghost" id="dcNo">Cerrar</button><button class="pill accent" id="dcOk">Guardar resultado</button>`, render:B=>{
    const timer = lv.m!=="max", cd = lv.m==="amrap";
    const pct = S.first==null ? 0 : Math.max(0, Math.min(1, S.gain/(lv.m==="time"?GOAL*0.4:GOAL)));
    B.innerHTML=`<div class="chhero c-${t.c}"><span class="chbolt">${animSVG(lv.pat)}</span>
        <p class="eyebrow">${esc(t.g)} · Nivel ${S.l+1} de ${t.lv.length}</p><h2>${esc(lv.n)}</h2><p>${esc(lv.d)}</p>
        ${S.best==null?`<div class="chgoal"><b>Primer intento</b><span>Hoy medimos tu punto de partida. Dalo todo, con buena técnica.</span></div>`
          :`<div class="chgoal"><b>Objetivo de hoy: ${lv.m==="time"?"bajar de ":"superar "}${fmtV(lv,S.best)}</b><span>Tu meta para hoy: ${fmtV(lv,S.target)}</span></div>`}</div>
      ${t.grips?`<div class="gripsel">${t.grips.map(g=>`<button class="${g.id===grip()?"on":""}" data-gr="${g.id}"><b>${g.n}</b><small>${g.d}</small></button>`).join("")}</div>
        <p class="hint">Cada toma guarda su propio progreso. Tip: entre intentos, en tus días de entreno hacé 3 a 5 series de la mitad de tu máximo, sin llegar al fallo. Así se suman repeticiones más rápido.</p>`:""}
      ${lastDays!=null && lastDays<2 && S.last.fecha!==today()?`<p class="hint">Lo hiciste ${lastDays===1?"ayer":"hace poco"}. Mejorás más si descansás 48 horas entre intentos, pero podés hacerlo igual.</p>`:""}
      ${S.last&&S.last.fecha===today()?`<div class="done-w"><b>Hoy ya lo hiciste: ${fmtV(lv,S.last.v)}</b><span class="hint">El próximo intento, en 2 o 3 días.</span></div>`:""}
      ${timer?`<div class="chclock"><b id="dcT">${cd?mmss(lv.sec):"00:00"}</b><span id="dcS" class="hint">${cd?`${lv.sec/60} ${lv.sec===60?"minuto":"minutos"}: contá las repeticiones`:lv.m==="hold"?"Arrancá al tomar posición, pará al cortar":"Arrancá al salir, pará al llegar"}</span>
        <div class="row" style="justify-content:center"><button class="go" id="dcGo" aria-label="Empezar o pausar"></button><button class="iconbtn" id="dcR" aria-label="Reiniciar"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button></div></div>`:""}
      ${lv.m==="max"||lv.m==="amrap"?`<label class="f">Tu resultado<div class="unitbox"><input id="dcV" type="number" inputmode="numeric" placeholder="${S.target??0}"><span>${esc(lv.u)}</span></div></label>`:`<p class="hint" style="text-align:center">Al parar el reloj, ese tiempo queda como tu resultado.</p>`}
      ${S.best!=null?`<section class="group"><div class="row" style="justify-content:space-between"><h3>Tu progreso</h3><span class="chip ${S.gain>0?"on":""}">${S.gain>0?"+":""}${fmt(S.gain*100,0)}%</span></div>
        <div class="mini"><div><b>${fmtV(lv,S.first)}</b><span>Primer intento</span></div><div><b>${fmtV(lv,S.best)}</b><span>Mejor marca</span></div><div><b>${S.at.length}</b><span>Intentos</span></div></div>
        ${S.at.length>1?`<div class="chart">${lineChart(S.at.map(x=>x.v), S.at.map(x=>fDayShort(x.fecha)), lv.u)}</div>`:""}
        <div><div class="lvbar"><i style="width:${Math.max(3,pct*100)}%"></i></div><div class="lvrow"><span>Próximo nivel: ${lv.m==="time"?"bajar a":"llegar a"} <b>${fmtV(lv,S.goal)}</b></span><span>${fmt(pct*100,0)}%</span></div></div>
        ${S.ready && S.l<t.lv.length-1?`<div class="lvup"><b>¡Mejoraste ${fmt(S.gain*100,0)}%! Estás listo para el nivel ${S.l+2}</b><span class="hint">${esc(t.lv[S.l+1].n)}</span><button class="pill accent" id="dcUp" style="justify-content:center">Subir de nivel</button></div>`:""}
      </section>`:""}
      <button class="pill ghost" id="dcCh" style="justify-content:center">Cambiar de grupo</button>
      <p class="hint">Repetí este desafío cada 2 o 3 días. Cada intento suma +10 pts, y cuando mejorás un 25% (o un 10% en carrera) pasás al siguiente nivel.</p>`;
    const T=$("#dcT"), Sx=$("#dcS"), G=$("#dcGo");
    const icon=r=>r?'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>';
    const el=()=>st.acc+(st.run?Date.now()-st.t0:0);
    const paint=()=>{ if(!T) return; const e=el()/1000;
      if(!cd){ T.textContent=clock(e).replace(/^00:/,""); return; }
      const left=Math.max(0,lv.sec-e); T.textContent=mmss(left);
      const sec=Math.ceil(left); if(st.run && sec<=3 && sec>0 && sec!==st.cnt){ st.cnt=sec; beep(880,0.1,1); }
      if(left<=0 && st.run){ st.acc=lv.sec*1000; st.run=false; G.innerHTML=icon(false); beep(1200,0.3,3); toast("¡Tiempo! Cargá cuántas hiciste"); const v=$("#dcV"); if(v) v.focus(); } };
    if(G){ G.innerHTML=icon(false); G.onclick=()=>{ wakeAudio(); if(st.run){ st.acc=el(); st.run=false; } else { if(cd && el()>=lv.sec*1000) return; st.t0=Date.now(); st.run=true; if(!st.acc) beep(1320,0.3,1); } G.innerHTML=icon(st.run); paint(); };
      $("#dcR").onclick=()=>{ st.run=false; st.acc=0; st.cnt=0; G.innerHTML=icon(false); paint(); }; tk=setInterval(paint,200); }
    const stop=()=>clearInterval(tk); if(ui.sheet) ui.sheet.onClose=stop;
    $("#dcNo").onclick=()=>{ stop(); closeSheet(); };
    $("#dcCh").onclick=()=>{ stop(); closeSheet(); openTrackPicker(); };
    B.querySelectorAll("[data-gr]").forEach(b=>b.onclick=async()=>{ if(b.dataset.gr===grip()) return; stop(); await saveProfile({agarre:b.dataset.gr}); closeSheet(); setTimeout(()=>openDesafio(),50); });
    const up=$("#dcUp"); if(up) up.onclick=async()=>{ const m={...(profile().nivDes||{})}; m[tkey(id)]=S.l+1; await saveProfile({nivDes:m}); toast(`¡Nivel ${S.l+2}! ${t.lv[S.l+1].n}`); stop(); closeSheet(); };
    $("#dcOk").onclick=async()=>{ let v;
      if(lv.m==="hold"||lv.m==="time"){ v=Math.round(el()/1000); if(!v){ toast("Arrancá el reloj y paralo al terminar"); return; } }
      else { v=num($("#dcV").value); if(!v){ toast("Cargá cuántas hiciste"); $("#dcV").focus(); return; } }
      const prevBest=S.best;
      try{ await addDoc("desafios",{track:id, ...(t.grips?{agarre:grip()}:{}), nivel:S.l, v, fecha:today(), creado:Date.now()}); stop();
        const S2=trackStat(id);
        const msg = prevBest==null ? `Punto de partida: ${fmtV(lv,v)}. ¡A mejorarlo!` :
          better(lv.m,v,prevBest) ? `¡Nueva mejor marca! ${fmtV(lv,v)} · +10 pts` :
          v===prevBest ? `Igualaste tu mejor marca. Muy bien, +10 pts` : `Hoy: ${fmtV(lv,v)}. Normal entre días; descansá y volvé en 48 h`;
        toast(msg); if(S2.ready && S2.l<t.lv.length-1) setTimeout(()=>toast("¡Llegaste a la meta! Podés subir de nivel"),2800);
        closeSheet(); }catch(e){ saveErr(e); } };
  }});
}
function gripLines(t){ const lvl=profile().nivDes||{};
  return t.grips.map(g=>{ const l=lvl[`${t.id}:${g.id}`]||0, lv=t.lv[l]; const at=state.desafios.filter(x=>x.track===t.id&&(x.agarre||"sup")===g.id&&x.nivel===l);
    const best=at.length?at.reduce((a,x)=>better(lv.m,x.v,a)?x.v:a,at[0].v):null;
    return `<small class="tl">${g.n}: nivel ${l+1}${best!=null?` · mejor ${fmtV(lv,best)}`:" · sin intentos"}</small>`; }).join(""); }
function openTrackPicker(){
  openSheet({title:"Elegí tu desafío", render:B=>{
    const cur=activeTrack();
    B.innerHTML=`<div class="intro"><h2>¿Qué querés mejorar?</h2><p class="hint">Elegí un grupo. Vas a repetir el mismo desafío cada 2 o 3 días y la app te muestra cuánto mejorás. Cuando lo superás, pasás al siguiente nivel.</p></div>
      <div class="grp">${TRACKS.map(t=>{ const S=trackStat(t.id); return `<button class="grpb trk c-${t.c} ${cur===t.id?"on":""}" data-tr="${t.id}"><span class="gi">${animSVG(S.lv.pat)}</span><span class="grow"><b>${t.g}</b><small>${t.z}</small>${t.grips?gripLines(t):`<small class="tl">Nivel ${S.l+1}: ${esc(S.lv.n)}${S.best!=null?` · mejor ${fmtV(S.lv,S.best)} (${S.gain>0?"+":""}${fmt(S.gain*100,0)}%)`:""}</small>`}</span>${cur===t.id?'<span class="chip on">Activo</span>':""}</button>`; }).join("")}</div>`;
    B.querySelectorAll("[data-tr]").forEach(b=>b.onclick=async()=>{ await saveProfile({desafio:b.dataset.tr}); closeSheet(); setTimeout(()=>openDesafio(),50); });
  }});
}
$("#fab").onclick=()=>openDesafio();

/* ===== ANOTAR MEJORAS (para revisar con Claude) ===== */
const FB_TAGS=[["idea","Idea"],["falla","Algo falla"],["incomodo","Incómodo"],["ejercicio","Ejercicio"]];
const FB_WHERE={perfil:"Perfil",entrena:"Entrena",nutri:"Nutrición"};
function fbCount(){ const n=state.mejoras.filter(x=>!x.hecha).length, b=$("#fbN"); if(!b) return; b.hidden=!n; b.textContent=n; }
function openFeedback(){
  const where = ui.sheet ? ui.sheet.title : (FB_WHERE[ui.tab]||"");
  const st={tag:"idea"};
  const w=document.createElement("div"); w.className="medov"; w.setAttribute("role","dialog"); w.setAttribute("aria-label","Anotar una mejora");
  const draw=()=>{
    const list=state.mejoras.slice().sort((a,b)=>(b.creado||0)-(a.creado||0));
    w.innerHTML=`<div class="medcard">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>Anotar una mejora</h3><button class="iconbtn" id="fbX" aria-label="Cerrar">✕</button></div>
      <p class="hint">Lo que te moleste, falte o se te ocurra mientras usás la app. Después lo revisamos juntos.${where?` Pantalla: <b style="color:var(--ink)">${esc(where)}</b>.`:""}</p>
      <div class="fbtags">${FB_TAGS.map(([k,n])=>`<button class="chip ${st.tag===k?"on":""}" data-fbt="${k}">${n}</button>`).join("")}</div>
      <textarea id="fbT" rows="4" placeholder="Ej.: el descanso de sentadilla es muy corto; quiero ver el peso de la semana pasada…">${esc(st.txt||"")}</textarea>
      <button class="pill accent" id="fbOk" style="justify-content:center">Guardar nota</button>
      ${list.length?`<p class="eyebrow" style="margin-top:6px">Tus notas (${list.filter(x=>!x.hecha).length} pendientes)</p>
      <div class="fblist">${list.map(x=>`<div class="fbit ${x.hecha?"done":""}"><div class="grow">${esc(x.texto)}<small>${esc((FB_TAGS.find(t=>t[0]===x.tag)||[0,""])[1])}${x.donde?" · "+esc(x.donde):""} · ${fDayShort(x.fecha)}${x.hecha?" · resuelta":""}</small></div><button class="del" data-fbd="${esc(x.id)}">Borrar</button></div>`).join("")}</div>`:""}
    </div>`;
    w.querySelector("#fbX").onclick=()=>w.remove();
    w.querySelectorAll("[data-fbt]").forEach(b=>b.onclick=()=>{ st.txt=w.querySelector("#fbT").value; st.tag=b.dataset.fbt; draw(); });
    w.querySelector("#fbOk").onclick=async()=>{ const t=w.querySelector("#fbT").value.trim(); if(!t){ toast("Escribí la nota"); return; }
      try{ await addDoc("mejoras",{texto:t, tag:st.tag, donde:where, fecha:today(), creado:Date.now(), hecha:false}); st.txt=""; toast("Nota guardada"); draw(); }catch(e){ saveErr(e); } };
    w.querySelectorAll("[data-fbd]").forEach(b=>b.onclick=twoTap(b,"¿Seguro?",async()=>{ try{ await delDoc("mejoras",b.dataset.fbd); draw(); }catch(e){ saveErr(e); } }));
    const ta=w.querySelector("#fbT"); ta.oninput=()=>st.txt=ta.value;
  };
  document.body.appendChild(w); draw(); w.querySelector("#fbT").focus();
}
$("#fbBtn").onclick=openFeedback;
